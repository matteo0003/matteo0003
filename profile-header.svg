<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">matteo0003 — Full-stack developer</title>
  <desc id="d">Banner with the name matteo0003 and the tagline Thoughtful interfaces, reliable systems, clean code.</desc>

  <style>
    .bg      { fill: #0D1117; }
    .dot     { fill: #FAFAFA; opacity: 0.07; }
    .border  { stroke: #27272A; }
    .glow    { stop-color: #FAFAFA; }
    .title   { fill: #FAFAFA; }
    .sub     { fill: #D4D4D8; }
    .muted   { fill: #A1A1AA; }
    .accent  { fill: #FAFAFA; }

    @media (prefers-color-scheme: light) {
      .bg      { fill: #FAFAFA; }
      .dot     { fill: #18181B; opacity: 0.08; }
      .border  { stroke: #E4E4E7; }
      .glow    { stop-color: #18181B; }
      .title   { fill: #18181B; }
      .sub     { fill: #3F3F46; }
      .muted   { fill: #71717A; }
      .accent  { fill: #18181B; }
    }

    .title, .sub, .muted {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .fade   { opacity: 0; animation: fade 1s ease-out forwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .45s; }
    .d3 { animation-delay: .75s; }
    .d4 { animation-delay: 1.05s; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .line { transform-origin: 600px 0; animation: grow 1.2s .3s ease-out both; }
    @keyframes grow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .line { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="2" cy="2" r="1"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop class="glow" offset="0" stop-opacity="0.10"/>
      <stop class="glow" offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
      <stop class="glow" offset="0" stop-opacity="0"/>
      <stop class="glow" offset="0.5" stop-opacity="0.9"/>
      <stop class="glow" offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="320" rx="16"/>
  <rect width="1200" height="320" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="16" fill="url(#halo)"/>
  <rect class="border" x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none"/>

  <!-- Eyebrow -->
  <g class="fade d1">
    <text class="muted mono" x="600" y="92" text-anchor="middle" font-size="14" letter-spacing="4">PORTFOLIO · 2026</text>
  </g>

  <!-- Name -->
  <g class="fade d2">
    <text class="title" x="600" y="170" text-anchor="middle" font-size="72" font-weight="700" letter-spacing="-2">matteo0003</text>
  </g>

  <!-- Animated rule -->
  <rect class="line" x="300" y="193" width="600" height="1.5" fill="url(#rule)"/>

  <!-- Role -->
  <g class="fade d3">
    <text class="sub" x="600" y="232" text-anchor="middle" font-size="24" font-weight="500">Full-stack developer</text>
  </g>

  <!-- Tagline -->
  <g class="fade d4">
    <text class="muted mono" x="600" y="268" text-anchor="middle" font-size="15" letter-spacing="1">Thoughtful interfaces · Reliable systems · Clean code</text>
  </g>

  <!-- Corner marks -->
  <g class="accent" opacity="0.5">
    <rect x="32" y="32" width="14" height="1.5"/><rect x="32" y="32" width="1.5" height="14"/>
    <rect x="1154" y="32" width="14" height="1.5"/><rect x="1166.5" y="32" width="1.5" height="14"/>
    <rect x="32" y="286.5" width="14" height="1.5"/><rect x="32" y="274" width="1.5" height="14"/>
    <rect x="1154" y="286.5" width="14" height="1.5"/><rect x="1166.5" y="274" width="1.5" height="14"/>
  </g>
</svg>
